    <text x="76" y="76" fill="#0C71E4" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="16" letter-spacing="2.5">FEATURE · DUAL-RING SSA ENGINE</text>
    <text x="1364" y="76" text-anchor="end" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="400" font-size="15" letter-spacing="2">OPENCAD · CDML v1.0</text>
    <text x="76" y="1018" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="300" font-size="15">hassaanmaqsood.github.io/opencad</text>
    <text x="1364" y="1018" text-anchor="end" fill="#52525B" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="15" letter-spacing="2">AUTO-DIFF + INTERVALS</text>
  
    <text x="76" y="176" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="44" letter-spacing="-1.5">One Bytecode Tape, Two Rings</text>
    <text x="76" y="224" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="22">Exact Dual-Number Surface Normals &amp; Interval Octree Pruning</text>
    
      <g transform="translate(80, 290) scale(1)">
