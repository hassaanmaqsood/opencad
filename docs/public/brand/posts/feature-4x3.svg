        <path d="M 520 74 L 320 156" stroke="#18181B" stroke-width="2" fill="none" marker-end="url(#arrInk)"/>
        <path d="M 760 74 L 960 156" stroke="#18181B" stroke-width="2" fill="none" marker-end="url(#arrInk)"/>

