          <line x1="0" y1="112.5" x2="340" y2="112.5" stroke="#E4E4E7" stroke-width="1.2" stroke-dasharray="5 5"/>
          <line x1="170" y1="0" x2="170" y2="225" stroke="#E4E4E7" stroke-width="1.2" stroke-dasharray="5 5"/>
          <circle cx="170" cy="112.5" r="52" fill="#FFFFFF" stroke="#0C71E4" stroke-width="2.8"/>
