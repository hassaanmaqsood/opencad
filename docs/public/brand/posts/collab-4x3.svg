            <line x1="170" y1="0" x2="170" y2="60"/><line x1="255" y1="0" x2="170" y2="60"/><line x1="255" y1="0" x2="255" y2="56"/>
            <line x1="340" y1="0" x2="255" y2="56"/><line x1="0" y1="112" x2="85" y2="56"/><line x1="0" y1="112" x2="118" y2="112"/>
            <line x1="340" y1="112" x2="255" y2="56"/><line x1="340" y1="112" x2="222" y2="112"/>
            <line x1="0" y1="225" x2="85" y2="168"/><line x1="85" y1="225" x2="170" y2="165"/><line x1="170" y1="225" x2="170" y2="165"/>
