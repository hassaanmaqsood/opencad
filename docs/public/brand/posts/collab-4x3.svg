          <text x="170" y="117" text-anchor="middle" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="14.5">106.4 °C</text>
          <text x="170" y="256" text-anchor="middle" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="15">T_base = 180.0 °C</text>
          <text x="170" y="302" text-anchor="middle" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="17">FEAScript 2D FEM (Plasma)</text>
