<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" fill="none">
    <rect width="1080" height="1440" fill="#FFFFFF"/>
    
  <defs>
    <marker id="arrInk" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#18181B"/>
    </marker>
    <marker id="arrBlue" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#0C71E4"/>
    </marker>
    <linearGradient id="plasmaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F0F921"/>
      <stop offset="28%" stop-color="#F89540"/>
      <stop offset="55%" stop-color="#CC4778"/>
      <stop offset="80%" stop-color="#7E03A8"/>
      <stop offset="100%" stop-color="#0D0887"/>
    </linearGradient>
    <linearGradient id="plasmaHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D0887"/>
      <stop offset="25%" stop-color="#7201A8"/>
      <stop offset="50%" stop-color="#CC4778"/>
      <stop offset="75%" stop-color="#F89540"/>
      <stop offset="100%" stop-color="#F0F921"/>
    </linearGradient>
  </defs>

    
    <text x="76" y="76" fill="#0C71E4" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="16" letter-spacing="2.5">COLLABORATION · MULTI-PHYSICS</text>
    <text x="1004" y="76" text-anchor="end" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="400" font-size="15" letter-spacing="2">OPENCAD · CDML v1.0</text>
    <text x="76" y="1378" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="300" font-size="15">hassaanmaqsood.github.io/opencad</text>
    <text x="1004" y="1378" text-anchor="end" fill="#52525B" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="15" letter-spacing="2">FEASCRIPT × OPENCAD</text>
  
    <text x="76" y="182" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="40" letter-spacing="-1.5">FEAScript × OpenCAD</text>
    <text x="76" y="228" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="20">Closed-Loop CDML &lt;sketch&gt; to 2D Thermal FEM &amp; 0x1F0000 Field</text>
    
      <!-- Top: OpenCAD CDML <sketch> -->
      <g transform="translate(330, 340)">
        <text x="210" y="-18" text-anchor="middle" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="16">id="top" (NURBS deg=1)</text>
        <rect x="0" y="0" width="420" height="260" fill="#FFFFFF" stroke="#18181B" stroke-width="2.6"/>
        <line x1="0" y1="130" x2="420" y2="130" stroke="#E4E4E7" stroke-width="1.2" stroke-dasharray="6 5"/>
        <line x1="210" y1="0" x2="210" y2="260" stroke="#E4E4E7" stroke-width="1.2" stroke-dasharray="6 5"/>
        <circle cx="210" cy="130" r="64" fill="#FFFFFF" stroke="#0C71E4" stroke-width="3"/>
        <text x="210" y="136" text-anchor="middle" fill="#0C71E4" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="17">id="bore"</text>
        <text x="210" y="292" text-anchor="middle" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="18">1. OpenCAD CDML &lt;sketch&gt;</text>
      </g>

      <!-- Middle Vertical Loop Arrows -->
      <g transform="translate(540, 665)">
        <line x1="-90" y1="0" x2="-90" y2="120" stroke="#18181B" stroke-width="2.4" marker-end="url(#arrInk)"/>
        <text x="-112" y="66" text-anchor="end" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="16">cdmlToFEAScriptGeometry()</text>

        <line x1="90" y1="120" x2="90" y2="0" stroke="#0C71E4" stroke-width="2.6" marker-end="url(#arrBlue)"/>
        <text x="112" y="56" fill="#0C71E4" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="16">0x1F0000 Voxel Field</text>
        <text x="112" y="82" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="400" font-size="15">&lt;probe id="bore_temp"&gt;</text>
      </g>

      <!-- Bottom: FEAScript 2D Mesh + Plasma Field -->
      <g transform="translate(330, 845)">
        <rect x="0" y="0" width="420" height="260" fill="url(#plasmaGrad)" stroke="#18181B" stroke-width="2.4"/>
        <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1">
          <line x1="0" y1="0" x2="105" y2="65"/><line x1="105" y1="0" x2="105" y2="65"/><line x1="105" y1="0" x2="210" y2="66"/>
          <line x1="210" y1="0" x2="210" y2="66"/><line x1="315" y1="0" x2="210" y2="66"/><line x1="315" y1="0" x2="315" y2="65"/>
          <line x1="420" y1="0" x2="315" y2="65"/><line x1="0" y1="130" x2="105" y2="65"/><line x1="0" y1="130" x2="146" y2="130"/>
          <line x1="420" y1="130" x2="315" y2="65"/><line x1="420" y1="130" x2="274" y2="130"/>
          <line x1="0" y1="260" x2="105" y2="195"/><line x1="105" y1="260" x2="210" y2="194"/><line x1="210" y1="260" x2="210" y2="194"/>
          <line x1="315" y1="260" x2="210" y2="194"/><line x1="420" y1="260" x2="315" y2="195"/>
        </g>
        <circle cx="210" cy="130" r="64" fill="#FFFFFF" stroke="#0C71E4" stroke-width="2.8"/>
        <text x="210" y="136" text-anchor="middle" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="16">106.4 °C</text>
        <text x="210" y="298" text-anchor="middle" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="18">2. FEAScript 2D FEM (Plasma)</text>
      </g>
    
  </svg>