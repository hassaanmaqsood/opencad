<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none">
    <rect width="1080" height="1080" fill="#FFFFFF"/>
    
  <defs>
    <marker id="arrInk" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#18181B"/>
    </marker>
    <marker id="arrBlue" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#0C71E4"/>
    </marker>
    <linearGradient id="plasmaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F0F921"/>
      <stop offset="28%" stop-color="#F89540"/>
      <stop offset="55%" stop-color="#CC4778"/>
      <stop offset="80%" stop-color="#7E03A8"/>
      <stop offset="100%" stop-color="#0D0887"/>
    </linearGradient>
    <linearGradient id="plasmaHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D0887"/>
      <stop offset="25%" stop-color="#7201A8"/>
      <stop offset="50%" stop-color="#CC4778"/>
      <stop offset="75%" stop-color="#F89540"/>
      <stop offset="100%" stop-color="#F0F921"/>
    </linearGradient>
  </defs>

    
    <text x="76" y="76" fill="#0C71E4" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="16" letter-spacing="2.5">MILESTONE · VERIFICATION GATES</text>
    <text x="1004" y="76" text-anchor="end" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="400" font-size="15" letter-spacing="2">OPENCAD · CDML v1.0</text>
    <text x="76" y="1018" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="300" font-size="15">hassaanmaqsood.github.io/opencad</text>
    <text x="1004" y="1018" text-anchor="end" fill="#52525B" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="15" letter-spacing="2">Δ ≤ 10⁻⁷ MM · 0 LEAKS</text>
  
    <text x="76" y="176" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="44" letter-spacing="-1.5">199/199 Native Zig Tests</text>
    <text x="76" y="224" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="22">Adaptive Shewchuk Predicates &amp; Zero-Primitive Mathematical Gates</text>

    <!-- Boxless Quantized Staircase Precision Escalation Diagram (Zero Line-Text Crossings) -->
    <g transform="translate(90, 360)">
      <!-- Precision Threshold Line (10^-7 mm) -->
      <line x1="0" y1="246" x2="900" y2="246" stroke="#0C71E4" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="900" y="232" text-anchor="end" fill="#0C71E4" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="15.5">Oracle Tolerance Δ ≤ 10⁻⁷ mm</text>

      <!-- Quantized Staircase Trajectory -->
      <path d="M 20 70 H 234 V 185 H 468 V 308 H 702 V 405 H 880" stroke="#18181B" stroke-width="2.8" fill="none"/>

      <!-- Stage 1: IEEE-754 f64 -->
      <circle cx="20" cy="70" r="6.5" fill="#18181B"/>
      <text x="20" y="36" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="16.5">1. IEEE-754 f64</text>
      <text x="20" y="58" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="14.5">ε ≈ 10⁻¹⁶ · Fast Filter</text>

      <!-- Stage 2: Two-Product Expansion -->
      <circle cx="234" cy="185" r="6.5" fill="#18181B"/>
      <text x="250" y="151" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="16.5">2. Two-Product</text>
      <text x="250" y="173" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="14.5">ε ≈ 10⁻³¹ · Tight Bound</text>

      <!-- Stage 3: Adaptive Expansion -->
      <circle cx="468" cy="308" r="6.5" fill="#0A50A8"/>
      <text x="484" y="274" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="16.5">3. Adaptive Expansion</text>
      <text x="484" y="296" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="14.5">orient3d / inSphere</text>

      <!-- Stage 4: Exact Sign -->
      <circle cx="880" cy="405" r="7.5" fill="#0C71E4"/>
      <text x="718" y="371" fill="#0C71E4" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="16">4. Exact Sign (ε=0)</text>
      <text x="718" y="393" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="14">V − E + F = 2</text>
    </g>
  </svg>