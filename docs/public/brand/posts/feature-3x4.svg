<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" fill="none">
    <rect width="1080" height="1440" fill="#FFFFFF"/>
    
  <defs>
    <marker id="arrInk" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#18181B"/>
    </marker>
    <marker id="arrBlue" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#0C71E4"/>
    </marker>
    <linearGradient id="plasmaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F0F921"/>
      <stop offset="28%" stop-color="#F89540"/>
      <stop offset="55%" stop-color="#CC4778"/>
      <stop offset="80%" stop-color="#7E03A8"/>
      <stop offset="100%" stop-color="#0D0887"/>
    </linearGradient>
    <linearGradient id="plasmaHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D0887"/>
      <stop offset="25%" stop-color="#7201A8"/>
      <stop offset="50%" stop-color="#CC4778"/>
      <stop offset="75%" stop-color="#F89540"/>
      <stop offset="100%" stop-color="#F0F921"/>
    </linearGradient>
  </defs>

    
    <text x="76" y="76" fill="#0C71E4" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="16" letter-spacing="2.5">FEATURE · DUAL-RING SSA ENGINE</text>
    <text x="1004" y="76" text-anchor="end" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="400" font-size="15" letter-spacing="2">OPENCAD · CDML v1.0</text>
    <text x="76" y="1378" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="300" font-size="15">hassaanmaqsood.github.io/opencad</text>
    <text x="1004" y="1378" text-anchor="end" fill="#52525B" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="600" font-size="15" letter-spacing="2">AUTO-DIFF + INTERVALS</text>
  
    <text x="76" y="176" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="40" letter-spacing="-1.5">One Bytecode Tape, Two Rings</text>
    <text x="76" y="224" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="20">Exact Dual-Number Surface Normals &amp; Interval Octree Pruning</text>
    
      <text x="540" y="350" text-anchor="middle" fill="#0C71E4" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="26">SSA Bytecode Tape: F(x, y, z)</text>
      <path d="M 460 375 L 280 470" stroke="#18181B" stroke-width="2.2" fill="none" marker-end="url(#arrInk)"/>
      <path d="M 620 375 L 800 470" stroke="#18181B" stroke-width="2.2" fill="none" marker-end="url(#arrInk)"/>

      <!-- Left: Dual Number Normal -->
      <g transform="translate(80, 500)">
        <path d="M 40 260 Q 190 90 370 215" fill="none" stroke="#18181B" stroke-width="3"/>
        <line x1="105" y1="192" x2="295" y2="156" stroke="#71717A" stroke-width="1.4" stroke-dasharray="6 5"/>
        <circle cx="200" cy="174" r="6" fill="#0C71E4"/>
        <line x1="200" y1="174" x2="174" y2="54" stroke="#0C71E4" stroke-width="3" marker-end="url(#arrBlue)"/>
        <text x="196" y="72" fill="#0C71E4" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="24">∇F</text>
        <text x="200" y="345" text-anchor="middle" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="20">Ring 1: Dual (u, du)</text>
        <text x="200" y="376" text-anchor="middle" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="16">Exact Analytical Normals</text>
      </g>

      <!-- Right: Interval Octree Pruning -->
      <g transform="translate(560, 500)">
        <g transform="translate(110, 28)">
          <line x1="120" y1="0" x2="120" y2="240" stroke="#71717A" stroke-width="1.4"/>
          <line x1="0" y1="120" x2="240" y2="120" stroke="#71717A" stroke-width="1.4"/>
          <text x="54" y="64" text-anchor="middle" fill="#71717A" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="16">F &gt; 0</text>
          <text x="186" y="186" text-anchor="middle" fill="#71717A" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="16">F &lt; 0</text>
          <line x1="180" y1="0" x2="180" y2="120" stroke="#18181B" stroke-width="1.2"/>
          <line x1="120" y1="60" x2="240" y2="60" stroke="#18181B" stroke-width="1.2"/>
          <line x1="60" y1="120" x2="60" y2="240" stroke="#18181B" stroke-width="1.2"/>
          <line x1="0" y1="180" x2="120" y2="180" stroke="#18181B" stroke-width="1.2"/>
          <path d="M 24 236 Q 120 120 236 24" fill="none" stroke="#0C71E4" stroke-width="3.4"/>
        </g>
        <text x="230" y="345" text-anchor="middle" fill="#18181B" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="20">Ring 2: Interval [a, b]</text>
        <text x="230" y="376" text-anchor="middle" fill="#52525B" font-family="'IBM Plex Mono', monospace" font-weight="300" font-size="16">94% Empty-Octree Pruning</text>
      </g>

      <text x="540" y="1140" text-anchor="middle" fill="#0A50A8" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="22">f(a + bε) = f(a) + b·f′(a)ε   ·   0∉[F_min, F_max] ⇒ Prune</text>
    
  </svg>